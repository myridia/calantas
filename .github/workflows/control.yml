name: Build Control
on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - mac
          - windows

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  linux:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  mac:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'mac'
    uses: ./.github/workflows/mac.yml
    secrets: inherit

  windows:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    uses: ./.github/workflows/windows.yml
    secrets: inherit
