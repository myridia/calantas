name: Linux
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to skip release)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag from caller (leave empty to use pushed tag)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  build:
    if: github.repository_owner == 'myridia'
    runs-on: ubuntu-22.04
    steps:
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential git cmake -y
          sudo apt-get install libgtk-3-dev -y
          sudo apt-get install mesa-common-dev libglu1-mesa-dev -y

      - name: Nappgui
        run: |
          git clone --depth 1 https://github.com/frang75/nappgui_src.git
          cd nappgui_src
          cmake -S . -B build -DNAPPGUI_DEMO=NO -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          sudo cmake --install build --config Release --prefix /usr/local/nappgui

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean
        shell: bash
        run: rm -rf build dist

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local/nappgui -Dnappgui_DIR=/usr/local/nappgui/cmake
          cmake --build build

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release tag (not a tag push and no tag input); skipping release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.release.outputs.publish == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'build/Release/bin/calantas'
          tag: ${{ steps.release.outputs.tag }}
          overwrite: true
          file_glob: true
